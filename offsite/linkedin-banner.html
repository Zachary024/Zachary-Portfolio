<!doctype html>
<!--
  LinkedIn personal banner — 1584 × 396 (the size LinkedIn asks for).
  Render it to PNG with tools/make-offsite-kit.py, or open it in a browser at
  1584 px wide and screenshot. Everything is inline so it renders anywhere.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn banner</title>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400 700;
        src: url("../assets/fonts/inter-latin-var.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 1584px;
        height: 396px;
        overflow: hidden;
      }

      .banner {
        position: relative;
        display: flex;
        align-items: center;
        gap: 56px;
        width: 100%;
        height: 100%;
        padding: 0 72px;
        background: #0b0d12;
        color: #eaeef5;
        font-family: Inter, system-ui, sans-serif;
        overflow: hidden;
      }

      /* The same glow as the site's social card, so the two match. */
      .banner::after {
        content: "";
        position: absolute;
        right: -180px;
        top: -220px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(59, 110, 246, 0.36),
          rgba(34, 211, 238, 0.1) 45%,
          transparent 70%
        );
      }

      .mark {
        position: relative;
        z-index: 1;
        width: 112px;
        height: 112px;
        flex: none;
      }

      .copy {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 14px;
      }

      h1 {
        font-size: 46px;
        font-weight: 600;
        line-height: 1.08;
        letter-spacing: -0.03em;
      }

      h1 span {
        background: linear-gradient(120deg, #3b6ef6, #22d3ee 55%, #6d5bf5);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        font-size: 20px;
        color: #a5aec0;
        letter-spacing: 0.01em;
      }

      .rule {
        width: 64px;
        height: 2px;
        background: linear-gradient(90deg, #3b6ef6, #22d3ee);
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <img class="mark" src="../assets/img/logo-mark.png" alt="" />
      <div class="copy">
        <h1>Full-stack developer<br /><span>building web products that ship.</span></h1>
        <div class="rule"></div>
        <p>Lagos, NG · Remote worldwide · xharkrii024@gmail.com</p>
      </div>
    </div>
  </body>
</html>
